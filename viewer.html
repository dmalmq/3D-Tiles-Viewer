<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>3D Tiles Viewer</title>
  </head>
  <body>
    <div id="cesiumContainer"></div>

    <!-- ── Top header ──────────────────────────────────────── -->
    <header id="appHeader">
      <div id="appLogo" class="app-logo-with-title">
        <span class="app-logo-mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 16 16" fill="none"><path d="M8 1.5l5.5 3v7L8 14.5l-5.5-3v-7L8 1.5zM2.5 4.5L8 7.5l5.5-3M8 7.5v7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="app-logo-title" data-i18n="header.title">3D Tiles Viewer</span>
      </div>
      <div id="headerSearch">
        <svg class="header-search-icon" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <input type="text" id="searchInput" data-i18n-placeholder="search.placeholder" placeholder="Search points…" autocomplete="off" data-i18n-aria-label="search.placeholder" aria-label="Search points" />
        <kbd class="header-search-kbd" aria-hidden="true">/</kbd>
        <div id="searchDropdown" style="display:none"></div>
      </div>
      <div id="headerActions">
        <button id="viewerLoadSessionBtn" class="header-btn" type="button">
          <svg width="14" height="14" viewBox="0 0 13 13" fill="none" aria-hidden="true"><path d="M1 9.5V11.5H12V9.5M6.5 8V0.5M3.5 3.5L6.5 0.5L9.5 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span data-i18n="header.load">Load</span>
        </button>
        <input type="file" id="viewerSessionInput" accept=".json" style="display:none" />
        <input type="file" id="viewerTilesetFolderInput" webkitdirectory directory multiple style="display:none" />
        <div class="header-divider"></div>
        <button id="languageToggle" class="header-btn header-icon-btn" data-i18n-title="header.lang.title" data-i18n-aria-label="header.lang.aria" title="Switch language" aria-label="Switch language">
          <span id="languageToggleLabel">あ</span>
        </button>
        <button id="themeToggle" class="header-btn header-icon-btn" data-i18n-title="header.theme.title" data-i18n-aria-label="header.theme.aria" title="Toggle light/dark theme" aria-label="Toggle theme">
          <svg class="theme-icon theme-icon-dark" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 1.8a6.2 6.2 0 1 0 6.2 7.4A5 5 0 0 1 8 1.8z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          <svg class="theme-icon theme-icon-light" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.5"/><path d="M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15M3.1 3.1l1.1 1.1M11.8 11.8l1.1 1.1M11.8 4.2l1.1-1.1M4.2 11.8l-1.1 1.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <div id="viewerSessionBanner" hidden></div>

    <!-- ── Left panel ──────────────────────────────────────── -->
    <aside id="leftPanel">

      <div id="viewerDatasetBar">
        <label class="field-label" for="viewerDatasetSelect" data-i18n="viewer.dataset">Dataset</label>
        <select id="viewerDatasetSelect">
          <option value="sample" data-i18n="viewer.dataset.sample">Public sample</option>
          <option value="shared" hidden data-i18n="viewer.dataset.shared">Loaded from URL</option>
          <option value="local" data-i18n="viewer.dataset.local">This device…</option>
        </select>
        <button id="viewerOpenFolderBtn" class="secondary-btn compact" type="button" data-i18n="viewer.dataset.chooseFolder">Choose folder</button>
        <p id="viewerDatasetNote" class="status-text" data-i18n="viewer.dataset.localNote">Local folders stay on this device. Nothing is uploaded.</p>
      </div>

      <div id="viewerVenueBar" hidden>
        <label class="field-label" for="viewerVenueSelect" data-i18n="viewer.venue">Venue</label>
        <select id="viewerVenueSelect"></select>
      </div>

      <!-- Buildings -->
      <div class="panel-section" id="viewerBuildingsSection">
        <div class="panel-section-header">
          <span data-i18n="viewer.buildings">Buildings</span>
        </div>
        <div class="section-body">
          <div class="viewer-building-row">
            <select id="viewerBuildingSelect"></select>
            <button id="viewerBuildingZoomBtn" class="icon-btn zoom-btn" type="button"
                    data-i18n-title="viewer.zoomBuilding" title="Zoom to building">⊕</button>
          </div>
          <p id="viewerNoBuildings" class="empty-msg" data-i18n="viewer.noBuildings">No buildings loaded.</p>
        </div>
      </div>

      <!-- Layers -->
      <div class="panel-section panel-section-scene" id="viewerLayersSection">
        <div class="panel-section-header">
          <span data-i18n="viewer.layers">Layers</span>
        </div>
        <div class="section-body">
          <div id="layerTypeFilters"></div>
          <ul id="viewerLayersList"></ul>
          <p id="viewerNoLayers" class="empty-msg" data-i18n="viewer.noLayers">No layers.</p>
        </div>
      </div>

      <!-- Imported Layers (PLATEAU catalog) -->
      <div class="panel-section" id="importedLayersSection">
        <button class="panel-section-header collapsible" type="button">
          <span class="panel-section-chevron"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><polyline points="2,4 6,8 10,4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span data-i18n="section.importedLayers">Imported Layers</span>
        </button>
        <div class="section-body">
          <ul id="importedLayersList"></ul>
          <p id="noImportedLayersMsg" class="empty-msg" data-i18n="import.empty">No imported layers.</p>
        </div>
      </div>

      <!-- Environment (imagery + terrain) -->
      <div class="panel-section" id="environmentSection">
        <button class="panel-section-header collapsible" type="button">
          <span class="panel-section-chevron"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><polyline points="2,4 6,8 10,4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span data-i18n="section.environment">Environment</span>
        </button>
        <div class="section-body">
          <label class="field-label" for="imagerySelect" data-i18n="basemap.imageryLabel">Imagery</label>
          <select id="imagerySelect">
            <option value="osm" data-i18n="imagery.osm">OpenStreetMap</option>
            <option value="ion-bing-aerial" data-i18n="imagery.bingAerial">Bing Aerial (Ion)</option>
            <option value="ion-sentinel" data-i18n="imagery.sentinel">Sentinel-2 (Ion)</option>
            <option value="esri-street" data-i18n="imagery.esriStreet">Esri World Street Map</option>
            <option value="esri-topo" data-i18n="imagery.esriTopo">Esri World Topo Map</option>
            <option value="esri-imagery" data-i18n="imagery.esriImagery">Esri World Imagery</option>
            <option value="esri-light-gray" data-i18n="imagery.esriLightGray">Esri Light Gray Canvas</option>
            <option value="carto-positron" selected data-i18n="imagery.cartoPositron">CartoDB Positron</option>
          </select>
          <label class="field-label" for="terrainSelect" data-i18n="basemap.terrainLabel">Terrain</label>
          <select id="terrainSelect">
            <option value="ellipsoid" data-i18n="terrain.flat">Flat (no elevation)</option>
            <option value="cesium-world" data-i18n="terrain.cesiumWorld">Cesium World Terrain (Ion)</option>
            <option value="gsi-dem5a" data-i18n="terrain.gsi5a">Japan DEM 5A – GSI (free)</option>
            <option value="gsi-dem5b" data-i18n="terrain.gsi5b">Japan DEM 5B – GSI (free)</option>
            <option value="plateau" selected data-i18n="terrain.plateau">PLATEAU Terrain (Japan)</option>
          </select>
          <label class="toggle-label">
            <input type="checkbox" id="lodFilterToggle" />
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
            <span data-i18n="models.highestLodOnly">Highest LOD only</span>
          </label>
          <p id="lodFilterStatus" class="status-text"></p>
          <label class="toggle-label">
            <input type="checkbox" id="plateauTransparencyToggle" />
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
            <span data-i18n="plateau.globalTransparency">Transparent PLATEAU data</span>
          </label>
          <label class="field-label" for="plateauTransparencySlider" data-i18n="plateau.transparencyAmount">Transparency</label>
          <div class="slider-row">
            <input id="plateauTransparencySlider" type="range" min="0" max="100" value="70" disabled />
            <output id="plateauTransparencyValue" for="plateauTransparencySlider">70%</output>
          </div>
          <div class="env-subheading" data-i18n="revit.sectionTitle">Revit models</div>
          <label class="field-label" for="revitHighlightSlider" data-i18n="revit.highlight">Highlight</label>
          <div class="slider-row">
            <input id="revitHighlightSlider" type="range" min="0" max="100" value="0" />
            <output id="revitHighlightValue" for="revitHighlightSlider">0%</output>
            <input id="revitHighlightColor" class="slider-color" type="color" value="#ff9f1c" title="Highlight colour" data-i18n-title="revit.highlightColor" />
          </div>
          <label class="toggle-label">
            <input type="checkbox" id="revitHighlightMaterialToggle" />
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
            <span data-i18n="revit.highlightMaterial">Glow in Revit material colours</span>
          </label>
          <label class="field-label" for="revitTransparencySlider" data-i18n="revit.transparencyAmount">Transparent elements</label>
          <div class="slider-row">
            <input id="revitTransparencySlider" type="range" min="0" max="100" value="70" />
            <output id="revitTransparencyValue" for="revitTransparencySlider">70%</output>
          </div>
          <label class="toggle-label">
            <input type="checkbox" id="gdbIconsToggle" checked />
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
            <span data-i18n="gdb.showIcons">Show GDB icons</span>
          </label>
          <label class="field-label" for="gdbIconDetailSlider" data-i18n="gdb.iconDetail" data-i18n-title="gdb.iconDetailHint" title="How many GDB icons to show at once. Higher shows more icons, closer together.">Icon detail</label>
          <div class="slider-row">
            <input id="gdbIconDetailSlider" type="range" min="-3" max="4" step="0.1" value="0" />
            <output id="gdbIconDetailValue" for="gdbIconDetailSlider">0</output>
          </div>
          <label class="field-label" for="gdbIconFloorSelect" data-i18n="gdb.iconFloor" data-i18n-title="gdb.iconFloorHint" title="Show GDB icons from one floor only. Models and floor plans are not affected.">Icon floor</label>
          <select id="gdbIconFloorSelect">
            <option value="" data-i18n="gdb.iconFloorAll">All floors</option>
          </select>
        </div>
      </div>

    </aside>

    <div id="leftPanelResizer" aria-hidden="true"></div>

    <!-- Map style (bottom left of the viewport), same control as the editor -->
    <div id="mapStylePicker" class="map-style-picker">
      <div id="mapStyleOptions" class="map-style-options" role="radiogroup" data-i18n-aria-label="map.picker.group" aria-label="Map style" hidden></div>
      <button id="mapStyleToggle" class="map-style-current" type="button" aria-expanded="false" aria-controls="mapStyleOptions">
        <span id="mapStyleSwatch" class="map-style-swatch" aria-hidden="true"></span>
        <span class="map-style-text">
          <span class="map-style-label" data-i18n="map.picker.label">Map</span>
          <span id="mapStyleName" class="map-style-name"></span>
        </span>
        <svg class="map-style-chevron" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <button id="leftPanelToggle" class="panel-toggle panel-toggle-left" type="button" title="Toggle left panel" aria-label="Collapse left panel" data-i18n-title="panel.left.title" data-i18n-aria-label="panel.left.aria">
      <svg class="toggle-arrow" width="10" height="10" viewBox="0 0 10 10" fill="none" aria-hidden="true"><polyline points="7,1 3,5 7,9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div id="loadingOverlay" class="loading-overlay" hidden>
      <div class="loading-overlay-spinner" aria-hidden="true"></div>
      <p id="loadingOverlayMessage" class="loading-overlay-message"></p>
      <p id="loadingOverlaySubmessage" class="loading-overlay-submessage"></p>
    </div>

    <script type="module" src="/src/viewer.js"></script>
  </body>
</html>
